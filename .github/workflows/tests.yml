
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start PostgreSQL
        run: docker compose up -d --wait db

      - name: Create dedicated integration test database
        run: |
          docker compose exec -T db createdb -U wallet wallet_test
          docker compose exec -T db psql -U wallet -d wallet_test -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/001_init.sql
          docker compose exec -T db psql -U wallet -d wallet_test -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/002_fee_and_hold_accounts.sql

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and PostgreSQL acceptance tests
        env:
          DATABASE_URL: postgresql://wallet:wallet@localhost:5432/wallet
          TEST_DATABASE_URL: postgresql://wallet:wallet@localhost:5432/wallet_test
        run: python -m pytest -q
